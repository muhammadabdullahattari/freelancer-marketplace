services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancer_marketplace_app
    env_file:
      - .env
    environment:
      TASK_ENGINE_BROKER: native
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "task-engine db migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  task_engine_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancer_marketplace_worker
    env_file:
      - .env
    environment:
      TASK_ENGINE_BROKER: native
    volumes:
      - .:/app
    command: task-engine worker start --app app.task_engine_app:engine --queues payments,default --broker native

  task_engine_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancer_marketplace_scheduler
    env_file:
      - .env
    environment:
      TASK_ENGINE_BROKER: native
    volumes:
      - .:/app
    command: task-engine scheduler start --app app.task_engine_app:engine

  task_engine_ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancer_marketplace_task_console
    env_file:
      - .env
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    command: task-engine ui --port 5555