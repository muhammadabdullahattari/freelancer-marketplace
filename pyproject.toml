[project]
name = "freelancer-marketplace"
version = "0.1.0"
description = "Freelancer Marketplace API"
readme = "README.md"
authors = [
    { name = "Muhammad Abdullah", email = "callmeab1182002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "passlib[bcrypt]==1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "supabase>=2.4.0",
    "python-dotenv==1.0.0",
    "python-multipart>=0.0.32",
    "celery>=5.3.4",
    "redis>=5.0.0",
    "flower>=2.0.1",
    "jinja2>=3.1.6",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=0.0.0",
]
